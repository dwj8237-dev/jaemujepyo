<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기업조회</title>
<style>
:root{--bg:#141414;--b2:#1f1f1f;--b3:#2a2a2a;--red:#e50914;--mu:#a3a3a3;--up:#46d369;--dn:#ff5a5f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif}
button{font-family:inherit;cursor:pointer;border:0;color:#fff}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 4%;background:linear-gradient(#000c,#0000)}
.logo{color:var(--red);font-weight:900;font-size:26px;text-decoration:none}
.sw{font-size:13px;color:var(--mu);cursor:pointer}
.hero{min-height:480px;padding:130px 4% 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 20% 0,#e5091459,#0000 55%),var(--bg)}
.hero h1{font-size:clamp(30px,5vw,60px);font-weight:900;line-height:1.15;margin:0 0 14px}
.hero h1 em{color:var(--red);font-style:normal}
.hero p{color:#ddd;margin:0 0 28px}
#form{width:100%;max-width:760px}
.row{display:flex;gap:10px}
#q{flex:1;min-width:0;height:58px;padding:0 18px;font-size:18px;color:#fff;background:#161616bf;border:1px solid #666;border-radius:6px;outline:0}
#q:focus{border-color:#fff}
.btn{height:58px;padding:0 30px;font-size:18px;font-weight:700;background:var(--red);border-radius:6px}
.btn:disabled{background:#7a1015;cursor:wait}
details.o{margin-top:12px;text-align:left;color:var(--mu);font-size:14px}
details.o select{height:40px;margin:8px 6px 0 0;padding:0 10px;color:#fff;background:#161616;border:1px solid #666;border-radius:6px}
main{padding:0 4% 80px;margin-top:-30px;position:relative;z-index:3}
#st{min-height:24px;margin-bottom:16px;color:var(--mu);white-space:pre-wrap;word-break:break-all}
#st.e{color:var(--dn)}
h3.t{font-size:22px;margin:8px 0 16px}h3.t small{font-size:13px;font-weight:400;color:var(--mu);margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--b2);border-radius:8px;overflow:hidden;cursor:pointer;transition:.2s;outline:0}
.card:hover,.card:focus-visible{transform:scale(1.04);box-shadow:0 12px 30px #000b}
.po{height:100px;display:flex;align-items:center;justify-content:center;font-weight:900;white-space:nowrap;overflow:hidden;padding:0 10px}
.inf{padding:14px 16px}
.nm{font-size:17px;font-weight:700;margin-bottom:6px;word-break:keep-all}
.en{font-size:12px;color:var(--mu);min-height:16px;margin-bottom:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mt{font-size:13px;display:flex;flex-direction:column;gap:4px}
.mt div{display:flex;justify-content:space-between;gap:8px}.mt span:first-child{color:var(--mu)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.act{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;padding:8px 0;font-size:13px;font-weight:600;border-radius:4px;background:var(--b3)}
.chip.p{background:var(--red)}
.pg{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:26px 0}
.pg button{min-width:40px;height:40px;background:var(--b3);border-radius:4px}
.pg button.on{background:var(--red)}.pg button:disabled{opacity:.35}
.fh{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.fh h2{margin:0;font-size:30px}.fh .sub{color:var(--mu);font-size:14px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.k{background:var(--b2);border-radius:8px;padding:16px 18px;border-top:3px solid var(--red)}
.k .l{color:var(--mu);font-size:13px}.k .v{font-size:25px;font-weight:800;margin:6px 0}.k .d{font-size:13px;color:var(--mu)}
.up{color:var(--up)}.dn,.neg{color:var(--dn)}
.pn{background:var(--b2);border-radius:8px;padding:18px;margin-bottom:24px}
.pn h3{margin:0 0 14px;font-size:17px}
.br{display:grid;grid-template-columns:52px 1fr 110px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.tr{height:20px;background:var(--b3);border-radius:3px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--red);width:0;transition:width .6s}
.br .n{text-align:right}
.tw{overflow-x:auto;background:var(--b2);border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;font-size:14px;white-space:nowrap;border-bottom:1px solid #333;text-align:right}
th{color:var(--mu);background:#191919}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
footer{padding:28px 4% 50px;color:#777;font-size:12px;border-top:1px solid #222}
#toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:12px 22px;border-radius:6px;font-weight:600;transition:.25s;pointer-events:none;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 상담하기 */
#fab{position:fixed;right:24px;bottom:24px;z-index:90;height:54px;padding:0 22px;font-size:16px;font-weight:700;background:var(--red);border-radius:30px;box-shadow:0 8px 24px #e5091473}
#ph{position:fixed;right:24px;bottom:90px;z-index:95;width:320px;height:min(640px,calc(100vh - 110px));padding:10px;border-radius:42px;background:linear-gradient(145deg,#2c2c2c,#0a0a0a);border:2px solid #444;box-shadow:0 30px 70px #000d;opacity:0;transform:translateY(24px) scale(.95);transform-origin:bottom right;pointer-events:none;visibility:hidden;transition:.22s}
#ph.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.scr{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#181818;border-radius:32px}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:24px;background:#000;border-radius:0 0 16px 16px}
.sb{display:flex;justify-content:space-between;padding:8px 24px 4px;font-size:12px;font-weight:700}
.ch{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #333;font-size:17px;font-weight:800}
.ch small{display:block;font-size:11px;font-weight:400;color:var(--mu)}
.ch button{width:30px;height:30px;border-radius:50%;background:var(--b3)}
#cf{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#cf label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}#cf label b{color:var(--red)}
#cf select,#cf input,#cf textarea{width:100%;padding:11px 12px;font-size:14px;font-family:inherit;color:#fff;background:var(--b2);border:1px solid #444;border-radius:8px;outline:0}
#cf textarea{height:130px;resize:none}
#cf .bad{border-color:var(--dn)}
.hp{position:absolute;left:-9999px}
#cm{min-height:18px;font-size:12px;white-space:pre-wrap;color:var(--mu)}#cm.e{color:var(--dn)}#cm.ok{color:var(--up)}
.cb{width:100%;height:46px;flex:none;font-size:15px;font-weight:700;border-radius:10px;background:var(--red)}
.cb:disabled{background:#7a1015}.cb.m{background:#fff;color:#111}.cb[hidden]{display:none}
@media(max-width:600px){.row{flex-direction:column}#fab{right:14px;bottom:14px}#ph{right:50%;transform:translate(50%,24px) scale(.95);bottom:80px}#ph.open{transform:translate(50%,0)}}
</style></head><body>

<header><a class="logo" href="#" onclick="location.reload();return false">기업조회</a>
<label class="sw"><input type="checkbox" id="px"> CORS 프록시</label></header>

<section class="hero">
<h1>회사 이름만 입력하면<br><em>법인등록번호</em>와 재무제표까지.</h1>
<p>금융위원회 공공데이터로 기업 정보를 한 번에 확인하세요.</p>
<form id="form"><div class="row"><input id="q" placeholder="회사명 또는 법인등록번호 13자리" autocomplete="off"><button class="btn" id="btn">조회</button></div>
<details class="o"><summary>재무제표 조회 기간 설정</summary><select id="y1"></select>~<select id="y2"></select></details></form>
</section>

<main>
<div id="st"></div>
<section id="cand" hidden><h3 class="t">법인 목록<small id="cc"></small></h3><div class="grid" id="grid"></div><nav class="pg" id="pg"></nav></section>
<section id="fin" hidden>
<div class="fh"><div><h2 id="fn"></h2><div class="sub"><span class="mono" id="fc"></span><button class="chip" id="fcp" style="flex:none;padding:4px 12px">복사</button><span id="ft"></span></div></div>
<button class="chip" id="back" style="flex:none;padding:10px 18px">← 목록으로</button></div>
<div class="kp" id="kp"></div>
<div class="pn"><h3>연도별 매출액</h3><div id="bars"></div></div>
<div class="tw"><table><thead><tr><th>사업연도</th><th>구분</th><th>매출액</th><th>영업이익</th><th>당기순이익</th><th>총자산</th><th>총부채</th><th>총자본</th><th>부채비율</th></tr></thead><tbody id="fb"></tbody></table></div>
</section>
</main>
<footer>데이터 출처: 금융위원회 기업기본정보 · 기업재무정보 (공공데이터포털). 자료가 없는 법인·연도는 표시되지 않을 수 있습니다.</footer>

<button id="fab" type="button">💬 상담하기</button>
<div id="ph"><div class="scr"><div class="notch"></div>
<div class="sb"><span id="pt">9:41</span><span>📶 🔋</span></div>
<div class="ch"><div>💬 상담하기<small>남겨주신 내용은 담당자에게 전달됩니다</small></div><button id="cx" type="button">✕</button></div>
<form id="cf" novalidate autocomplete="off">
<div><label>문의 유형 (선택)</label><select id="ct"><option value="">선택 안 함</option><option>서비스 이용 문의</option><option>데이터 오류 제보</option><option>기능 제안</option><option>제휴 · 광고 문의</option><option>기타</option></select></div>
<div><label>연락받을 번호 (선택)</label><input id="cp" type="tel" placeholder="010-0000-0000" maxlength="20"></div>
<div><label>문의 내용 <b>(필수)</b></label><textarea id="cmsg" maxlength="1000" placeholder="문의하실 내용을 입력해 주세요."></textarea></div>
<input id="hp" class="hp" tabindex="-1" autocomplete="off">
<div id="cm"></div>
<button class="cb" id="cs">문의하기</button>
<button type="button" class="cb m" id="cmail" hidden>✉️ 메일 앱으로 보내기</button>
</form></div></div>
<div id="toast"></div>

<script>
const KEY='ec06f12bf9d2ca6e6dd77b288e779bf9b84abb35318d62b7d5ff3eec77996b8a',
B='https://apis.data.go.kr/1160100/service',
OUT=B+'/GetCorpBasicInfoService_V2/getCorpOutline_V2',
FIN=B+'/GetFinaStatInfoService_V2/getSummFinaStat_V2',
MAIL='dwj8237@gmail.com',PS=20;
let cur=1,list=[];
const $=i=>document.getElementById(i);
const Y=new Date().getFullYear();
for(let y=Y;y>=2010;y--){$('y1').add(new Option(y+'년',y));$('y2').add(new Option(y+'년',y));}
$('y2').value=Y-1;$('y1').value=Y-5;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crno=v=>/^\d{13}$/.test(v)?v.slice(0,6)+'-'+v.slice(6):(v||'');
const biz=v=>/^\d{10}$/.test(v)?`${v.slice(0,3)}-${v.slice(3,5)}-${v.slice(5)}`:(v||'-');
function won(v){const n=Number(v);if(v==null||v===''||!isFinite(n))return'-';
 const a=Math.abs(n),jo=Math.floor(a/1e12),ek=Math.floor(a%1e12/1e8);
 const s=jo?jo.toLocaleString()+'조'+(ek?' '+ek.toLocaleString()+'억':''):ek?ek.toLocaleString()+'억':a.toLocaleString()+'원';
 return(n<0?'-':'')+s;}
const fw=v=>{const t=won(v);return t==='-'?t:`<span class="${Number(v)<0?'neg':''}" title="${Number(v).toLocaleString()}원">${t}</span>`};
const pct=v=>v==null||v===''||isNaN(v)?'-':Number(v).toFixed(2)+'%';
const color=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return`linear-gradient(135deg,hsl(${h},55%,32%),hsl(${(h+40)%360},60%,16%))`};
const PR={'(':')','[':']','{':'}','<':'>','（':'）','「':'」','『':'』'};
function label(n){const t=String(n||'').trim(),f=t[0],c=PR[f];
 if(c){let d=0;for(let i=0;i<t.length;i++){if(t[i]===f)d++;else if(t[i]===c&&--d===0)return t.slice(0,i+1)}return f}
 return(f||'?').toUpperCase()}
const fsz=s=>s.length<=1?54:s.length==2?48:s.length==3?42:s.length==4?34:Math.max(18,Math.floor(180/s.length));

function st(m,e){$('st').className=e?'e':'';$('st').textContent=m}
function hide(){$('cand').hidden=$('fin').hidden=true}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1500)}
function copy(t){(navigator.clipboard?.writeText(t)??Promise.reject()).then(()=>toast('복사했습니다: '+t)).catch(()=>{
 const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
 try{document.execCommand('copy');toast('복사했습니다: '+t)}catch{toast('복사 실패')}a.remove()})}

async function api(ep,p){
 let u=ep+'?'+new URLSearchParams({serviceKey:KEY,resultType:'json',...p});
 if($('px').checked)u='https://corsproxy.io/?url='+encodeURIComponent(u);
 let r;try{r=await fetch(u,{signal:AbortSignal.timeout(20000)})}
 catch(e){throw new Error(e.name==='TimeoutError'?'응답 시간 초과':'API 호출 실패 (CORS 또는 네트워크)\n→ 우측 상단 "CORS 프록시"를 켜고 다시 시도하세요.')}
 const tx=await r.text();let d;
 try{d=JSON.parse(tx)}catch{throw new Error('API 응답 오류 (HTTP '+r.status+')\n'+tx.slice(0,200))}
 const h=d?.response?.header;if(h&&h.resultCode!=='00')throw new Error(h.resultMsg+' ('+h.resultCode+')');
 const b=d?.response?.body;let it=b?.items?.item||[];if(!Array.isArray(it))it=[it];
 return{items:it,total:Number(b?.totalCount??it.length)}}

async function search(name){
 const m=new Map();
 for(let p=1;p<=5;p++){const{items,total}=await api(OUT,{pageNo:p,numOfRows:100,corpNm:name});
  for(const i of items){const k=i.crno||i.corpNm,o=m.get(k);if(!o||String(i.basDt||'')>String(o.basDt||''))m.set(k,i)}
  if(!items.length||p*100>=total)break}
 const g=s=>{const c=String(s||'').trim()[0]||'';return/[가-힣ㄱ-ㅎ]/.test(c)?0:/[A-Za-z0-9]/.test(c)?1:2};
 return[...m.values()].sort((a,b)=>(a.corpNm===name?0:1)-(b.corpNm===name?0:1)||g(a.corpNm)-g(b.corpNm)||String(a.corpNm).localeCompare(String(b.corpNm),'ko'))}

async function getFin(c,from,to){
 const ys=[];for(let y=+to;y>=+from;y--)ys.push(y);
 const rs=await Promise.allSettled(ys.map(y=>api(FIN,{pageNo:1,numOfRows:10,crno:c,bizYear:y})));
 const m=new Map(),er=[];
 rs.forEach((r,i)=>{if(r.status==='fulfilled'){for(const it of r.value.items){
  const k=(it.bizYear||ys[i])+'|'+(it.fnclDcd||''),o=m.get(k);
  if(!o||String(it.basDt||'')>String(o.basDt||''))m.set(k,it)}}else er.push(ys[i]+'년: '+r.reason.message)});
 return{items:[...m.values()],er}}

function showList(page){
 const tp=Math.max(1,Math.ceil(list.length/PS));cur=Math.min(Math.max(1,page),tp);
 const s=(cur-1)*PS,sl=list.slice(s,s+PS);
 $('cc').textContent=`총 ${list.length}개 · ${s+1}–${s+sl.length}번째`;
 $('grid').innerHTML=sl.map(i=>{const l=label(i.corpNm);return`
 <article class="card" tabindex="0" data-c="${esc(i.crno)}" data-n="${esc(i.corpNm)}">
 <div class="po" style="background:${color(i.corpNm)};font-size:${fsz(l)}px">${esc(l)}</div>
 <div class="inf"><div class="nm">${esc(i.corpNm)}</div><div class="en">${esc(i.corpEnsnNm||'')}</div>
 <div class="mt"><div><span>법인등록번호</span><span class="mono">${esc(crno(i.crno))}</span></div>
 <div><span>사업자번호</span><span class="mono">${esc(biz(i.bzno))}</span></div>
 <div><span>대표자</span><span>${esc(i.enpRprFnm||'-')}</span></div></div>
 <div class="act"><button type="button" class="chip p">재무제표</button><button type="button" class="chip" data-cp="${esc(i.crno)}">번호 복사</button></div></div></article>`}).join('');
 let h=`<button data-p="${cur-1}" ${cur==1?'disabled':''}>‹</button>`;
 const e=Math.min(tp,Math.max(1,cur-2)+4),a=Math.max(1,e-4);
 if(tp>1){for(let i=a;i<=e;i++)h+=`<button data-p="${i}" class="${i==cur?'on':''}">${i}</button>`;
  h+=`<button data-p="${cur+1}" ${cur==tp?'disabled':''}>›</button>`}else h='';
 $('pg').innerHTML=h}

function showFin(c,name,items){
 items.sort((a,b)=>(b.bizYear-a.bizYear)||String(a.fnclDcd).localeCompare(String(b.fnclDcd)));
 $('fn').textContent=name||'법인등록번호 조회 결과';$('fc').textContent=crno(c);$('fcp').dataset.v=c;
 $('back').hidden=list.length<=1;
 const L=items[0];$('ft').textContent=L.bizYear+'년 · '+(L.fnclDcdNm||L.fnclDcd||'재무제표');
 const P=items.find(i=>+i.bizYear===+L.bizYear-1&&i.fnclDcd===L.fnclDcd);
 const dl=k=>{const a=+L[k],b=P?+P[k]:NaN;if(!P||!isFinite(a)||!isFinite(b)||!b)return'전년 대비 -';
  const r=(a-b)/Math.abs(b)*100;return`<span class="${r>=0?'up':'dn'}">${r>=0?'▲':'▼'} ${Math.abs(r).toFixed(1)}%</span> 전년 대비`};
 const kp=(l,k)=>`<div class="k"><div class="l">${l}</div><div class="v">${won(L[k])}</div><div class="d">${dl(k)}</div></div>`;
 $('kp').innerHTML=kp('매출액','enpSaleAmt')+kp('영업이익','enpBzopPft')+kp('당기순이익','enpCrtmNpf')+kp('총자산','enpTastAmt');
 const py=new Map();for(const i of items)if(!py.has(i.bizYear))py.set(i.bizYear,i);
 const rows=[...py.values()].sort((a,b)=>a.bizYear-b.bizYear),mx=Math.max(...rows.map(r=>Math.abs(+r.enpSaleAmt)||0),1);
 $('bars').innerHTML=rows.map(r=>`<div class="br"><span>${esc(r.bizYear)}</span><div class="tr"><i data-w="${(Math.abs(+r.enpSaleAmt)||0)/mx*100}"></i></div><span class="n">${won(r.enpSaleAmt)}</span></div>`).join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.tr i').forEach(b=>b.style.width=b.dataset.w+'%')));
 $('fb').innerHTML=items.map(i=>`<tr><td>${esc(i.bizYear)}</td><td>${esc(i.fnclDcdNm||i.fnclDcd||'-')}</td><td>${fw(i.enpSaleAmt)}</td><td>${fw(i.enpBzopPft)}</td><td>${fw(i.enpCrtmNpf)}</td><td>${fw(i.enpTastAmt)}</td><td>${fw(i.enpTdbtAmt)}</td><td>${fw(i.enpTcptAmt)}</td><td>${pct(i.fnclDebtRto)}</td></tr>`).join('');
 $('fin').hidden=false;$('fin').scrollIntoView({block:'start'})}

async function load(c,name=''){
 hide();
 if(+$('y1').value>+$('y2').value){st('시작 연도가 종료 연도보다 클 수 없습니다.',1);if(list.length>1)$('cand').hidden=false;return}
 st('재무제표를 불러오는 중...');$('btn').disabled=true;
 try{const{items,er}=await getFin(c,$('y1').value,$('y2').value);
  if(!items.length){st(er.length?'오류:\n'+er.join('\n'):'조회된 재무제표가 없습니다. (비상장·소규모 법인이거나 자료가 없을 수 있습니다)',er.length>0);return}
  st('재무제표 '+items.length+'건'+(er.length?'\n일부 연도 오류:\n'+er.join('\n'):''));showFin(c,name,items)}
 catch(e){st('오류: '+e.message,1)}
 finally{$('btn').disabled=false;if($('fin').hidden&&list.length>1)$('cand').hidden=false}}

$('form').addEventListener('submit',async e=>{
 e.preventDefault();const raw=$('q').value.trim(),v=raw.replace(/-/g,'');
 if(!raw){st('회사명 또는 법인등록번호를 입력하세요.',1);return}
 if(/^\d{13}$/.test(v)){list=[];load(v);return}
 hide();st('법인을 검색하는 중...');$('btn').disabled=true;
 try{list=await search(raw);
  if(!list.length){st('검색된 법인이 없습니다.');return}
  if(list.length===1){$('btn').disabled=false;load(list[0].crno,list[0].corpNm);return}
  st('');showList(1);$('cand').hidden=false;$('cand').scrollIntoView({block:'start'})}
 catch(err){st('오류: '+err.message,1)}
 finally{$('btn').disabled=false}});

$('grid').addEventListener('click',e=>{
 const cp=e.target.closest('[data-cp]');if(cp){e.stopPropagation();copy(cp.dataset.cp);return}
 const c=e.target.closest('.card');if(c)load(c.dataset.c,c.dataset.n)});
$('grid').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(e.key==='Enter'&&c&&e.target===c)load(c.dataset.c,c.dataset.n)});
$('pg').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b||b.disabled)return;showList(+b.dataset.p);$('cand').scrollIntoView({block:'start'})});
$('fcp').addEventListener('click',e=>copy(e.currentTarget.dataset.v));
$('back').addEventListener('click',()=>{$('fin').hidden=true;if(list.length>1){$('cand').hidden=false;st('');$('cand').scrollIntoView({block:'start'})}});

/* ===== 상담하기 ===== */
const ph=$('ph'),cmsg=$('cmsg'),cp=$('cp'),ct=$('ct'),cm=$('cm'),cs=$('cs'),cmail=$('cmail');
const cmSet=(t,k='')=>{cm.textContent=t;cm.className=k};
function openChat(o){ph.classList.toggle('open',o);
 if(o){const d=new Date();$('pt').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(()=>cmsg.focus(),250)}}
$('fab').addEventListener('click',()=>openChat(!ph.classList.contains('open')));
$('cx').addEventListener('click',()=>openChat(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openChat(false)});
cmsg.addEventListener('input',()=>cmsg.classList.remove('bad'));
cp.addEventListener('input',()=>cp.classList.remove('bad'));
const content=()=>({type:ct.value||'선택 안 함',phone:cp.value.trim()||'입력 안 함',msg:cmsg.value.trim(),page:location.href,time:new Date().toLocaleString('ko-KR')});

cmail.addEventListener('click',()=>{
 const c=content();if(!c.msg){cmSet('문의 내용을 입력해 주세요.','e');cmsg.classList.add('bad');return}
 const body=`문의 유형: ${c.type}\n연락받을 번호: ${c.phone}\n\n[문의 내용]\n${c.msg}\n\n---\n접수 시각: ${c.time}`;
 location.href='mailto:'+MAIL+'?subject='+encodeURIComponent('[기업조회 상담] '+c.type)+'&body='+encodeURIComponent(body)});

$('cf').addEventListener('submit',async e=>{
 e.preventDefault();if($('hp').value)return;
 cmail.hidden=true;cmsg.classList.remove('bad');cp.classList.remove('bad');
 if(!cmsg.value.trim()){cmSet('문의 내용을 입력해 주세요.','e');cmsg.classList.add('bad');cmsg.focus();return}
 if(cp.value.trim()&&!/^[0-9+\-\s()]{7,20}$/.test(cp.value.trim())){cmSet('연락받을 번호 형식을 확인해 주세요.','e');cp.classList.add('bad');cp.focus();return}
 const c=content();cs.disabled=true;cs.textContent='전송 중...';cmSet('');
 try{
  const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(MAIL),{method:'POST',
   headers:{'Content-Type':'application/json',Accept:'application/json'},
   body:JSON.stringify({_subject:'[기업조회 상담] '+c.type,_template:'table',_captcha:'false',
    '문의 유형':c.type,'연락받을 번호':c.phone,'문의 내용':c.msg,'접수 페이지':c.page,'접수 시각':c.time}),
   signal:AbortSignal.timeout(15000)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!(d.success===true||d.success==='true'))throw new Error(d.message||r.status);
  cmSet('문의가 전송되었습니다. 감사합니다!','ok');cmsg.value='';cp.value='';ct.value='';toast('문의가 전송되었습니다')}
 catch(err){cmSet('전송에 실패했습니다.\n아래 버튼으로 메일 앱에서 직접 보내 주세요.','e');cmail.hidden=false}
 finally{cs.disabled=false;cs.textContent='문의하기'}});
</script>
</body></html>
