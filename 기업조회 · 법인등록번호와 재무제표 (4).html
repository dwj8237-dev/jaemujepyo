<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기업조회 · 법인등록번호와 재무제표</title>
<style>
  :root {
    --bg: #141414;
    --bg2: #1f1f1f;
    --bg3: #2a2a2a;
    --red: #e50914;
    --red-d: #b20710;
    --text: #fff;
    --muted: #a3a3a3;
    --line: #333;
    --up: #46d369;
    --down: #ff5a5f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ===== 헤더 ===== */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4%;
    background: linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%);
  }
  .logo { color: var(--red); font-weight: 900; font-size: 26px; letter-spacing: -1px; text-decoration: none; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 38px; height: 20px; border-radius: 20px; background: #555; position: relative; transition: .2s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + .track { background: var(--red); }
  .switch input:checked + .track::after { left: 20px; }

  /* ===== 히어로 ===== */
  .hero {
    position: relative; min-height: 520px; padding: 140px 4% 80px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(229,9,20,.35), transparent 55%),
      radial-gradient(ellipse at 90% 30%, rgba(120,0,10,.35), transparent 50%),
      var(--bg);
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
    background: linear-gradient(180deg, transparent, var(--bg));
    pointer-events: none;
  }
  .hero h1 { font-size: clamp(32px, 5.2vw, 64px); font-weight: 900; line-height: 1.15; margin: 0 0 16px; max-width: 900px; letter-spacing: -1.5px; }
  .hero h1 em { color: var(--red); font-style: normal; }
  .hero p { font-size: clamp(15px, 1.7vw, 22px); color: #ddd; margin: 0 0 32px; }

  form { position: relative; z-index: 2; width: 100%; max-width: 760px; }
  .search { display: flex; gap: 10px; }
  .search input[type=text] {
    flex: 1; min-width: 0; height: 60px; padding: 0 20px; font-size: 18px; color: #fff;
    background: rgba(22,22,22,.75); border: 1px solid #666; border-radius: 6px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input[type=text]::placeholder { color: #8c8c8c; }
  .search input[type=text]:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
  .btn {
    height: 60px; padding: 0 34px; font-size: 18px; font-weight: 700; color: #fff;
    background: var(--red); border: 0; border-radius: 6px; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #f6121d; }
  .btn:disabled { background: #7a1015; cursor: wait; }

  details.opts { margin-top: 14px; text-align: left; color: var(--muted); font-size: 14px; }
  details.opts summary { cursor: pointer; list-style: none; display: inline-block; padding: 4px 2px; }
  details.opts summary::-webkit-details-marker { display: none; }
  details.opts summary::after { content: " ▾"; }
  .years { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .years select {
    height: 42px; padding: 0 12px; font-size: 15px; color: #fff;
    background: rgba(22,22,22,.85); border: 1px solid #666; border-radius: 6px;
  }

  /* ===== 본문 ===== */
  main { position: relative; z-index: 3; padding: 0 4% 80px; margin-top: -40px; }
  #status { min-height: 24px; margin: 0 0 20px; color: var(--muted); font-size: 15px; white-space: pre-wrap; word-break: break-all; }
  #status.error { color: var(--down); }
  .section-title { font-size: 22px; font-weight: 700; margin: 8px 0 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .section-title small { font-size: 13px; font-weight: 400; color: var(--muted); }

  /* 회사 카드 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card {
    position: relative; background: var(--bg2); border-radius: 8px; overflow: hidden; cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease; outline: none;
  }
  .card:hover, .card:focus-visible { transform: scale(1.05); box-shadow: 0 12px 30px rgba(0,0,0,.7); z-index: 5; }
  .poster {
    height: 120px; display: flex; align-items: center; justify-content: center;
    padding: 0 10px; font-weight: 900; color: rgba(255,255,255,.92);
    text-shadow: 0 4px 16px rgba(0,0,0,.35);
    white-space: nowrap; overflow: hidden; letter-spacing: -1px;
  }
  .card .info { padding: 14px 16px 16px; }
  .card .name { font-size: 17px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; word-break: keep-all; }
  .card .en { font-size: 12px; color: var(--muted); margin-bottom: 10px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: #cfcfcf; display: flex; flex-direction: column; gap: 5px; }
  .meta div { display: flex; justify-content: space-between; gap: 8px; }
  .meta span:first-child { color: var(--muted); flex-shrink: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .card .actions { display: flex; gap: 8px; margin-top: 14px; }
  .chip {
    flex: 1; padding: 8px 0; font-size: 13px; font-weight: 600; border: 0; border-radius: 4px; cursor: pointer; color: #fff;
  }
  .chip.primary { background: var(--red); }
  .chip.primary:hover { background: #f6121d; }
  .chip.ghost { background: var(--bg3); }
  .chip.ghost:hover { background: #3d3d3d; }

  /* 페이지 이동 */
  .pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; margin: 28px 0 8px; }
  .pager button {
    min-width: 40px; height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--bg3); border: 0; border-radius: 4px; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { background: #3d3d3d; }
  .pager button.on { background: var(--red); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager .dots { color: var(--muted); padding: 0 4px; }

  /* 스켈레톤 */
  .skel { height: 270px; border-radius: 8px;
    background: linear-gradient(90deg, #1f1f1f 25%, #2b2b2b 37%, #1f1f1f 63%); background-size: 400% 100%;
    animation: shimmer 1.3s infinite; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* 재무 */
  .fin-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .fin-head h2 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .fin-head .sub { color: var(--muted); font-size: 14px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border: 1px solid #666; border-radius: 3px; color: #ddd; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .kpi { background: var(--bg2); border-radius: 8px; padding: 18px 20px; border-top: 3px solid var(--red); }
  .kpi .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .kpi .value { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .kpi .delta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }

  .panel { background: var(--bg2); border-radius: 8px; padding: 20px; margin-bottom: 26px; }
  .panel h3 { margin: 0 0 16px; font-size: 17px; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 56px 1fr 120px; align-items: center; gap: 12px; font-size: 13px; }
  .bar-track { height: 22px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--red-d), var(--red)); border-radius: 3px; transition: width .6s ease; width: 0; }
  .bar-row .v { text-align: right; color: #ddd; }

  .table-wrap { overflow-x: auto; background: var(--bg2); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 16px; font-size: 14px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; text-align: left; background: #191919; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #262626; }
  tbody tr:last-child td { border-bottom: 0; }
  .neg { color: var(--down); }

  details.raw { margin-top: 26px; color: var(--muted); font-size: 13px; }
  details.raw summary { cursor: pointer; }
  pre { background: #0d0d0d; padding: 14px; border-radius: 6px; overflow: auto; max-height: 320px; color: #bbb; }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translate(-50%, 20px); opacity: 0;
    background: #fff; color: #111; padding: 12px 22px; border-radius: 6px; font-weight: 600; font-size: 14px;
    transition: .25s; pointer-events: none; z-index: 100;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { padding: 30px 4% 50px; color: #777; font-size: 12px; border-top: 1px solid #222; }

  @media (max-width: 600px) {
    .search { flex-direction: column; }
    .btn, .search input[type=text] { height: 54px; }
    .bar-row { grid-template-columns: 46px 1fr 90px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#" onclick="location.reload();return false;">기업조회</a>
  <label class="switch" title="브라우저에서 직접 호출이 막힐 때만 켜세요">
    <input type="checkbox" id="useProxy" />
    <span class="track"></span>
    CORS 프록시
  </label>
</header>

<section class="hero">
  <h1>회사 이름만 입력하면<br /><em>법인등록번호</em>와 재무제표까지.</h1>
  <p>금융위원회 공공데이터로 기업 정보를 한 번에 확인하세요.</p>

  <form id="form">
    <div class="search">
      <input type="text" id="q" placeholder="회사명 또는 법인등록번호 13자리" autocomplete="off" autofocus />
      <button type="submit" class="btn" id="btn">조회</button>
    </div>
    <details class="opts">
      <summary>재무제표 조회 기간 설정</summary>
      <div class="years">
        <select id="yFrom"></select>
        <span>~</span>
        <select id="yTo"></select>
      </div>
    </details>
  </form>
</section>

<main>
  <div id="status"></div>

  <!-- 회사 목록 -->
  <section id="candBox" hidden>
    <div class="section-title">법인 목록 <small id="candCount"></small></div>
    <div class="grid" id="candGrid"></div>
    <nav class="pager" id="pager"></nav>
  </section>

  <!-- 재무 -->
  <section id="finBox" hidden>
    <div class="fin-head">
      <div>
        <h2 id="finName"></h2>
        <div class="sub">
          <span class="mono" id="finCrno"></span>
          <button class="chip ghost" id="finCopy" style="flex:none;padding:4px 12px">복사</button>
          <span class="tag" id="finType"></span>
        </div>
      </div>
      <button class="chip ghost" id="backBtn" style="flex:none;padding:10px 18px">← 목록으로</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <h3>연도별 매출액</h3>
      <div class="bars" id="bars"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>사업연도</th><th>구분</th>
            <th class="num">매출액</th><th class="num">영업이익</th><th class="num">당기순이익</th>
            <th class="num">총자산</th><th class="num">총부채</th><th class="num">총자본</th>
            <th class="num">부채비율</th>
          </tr>
        </thead>
        <tbody id="finBody"></tbody>
      </table>
    </div>
    <p style="color:#777;font-size:12px;margin-top:10px">금액은 조·억 단위로 표시하며, 값에 마우스를 올리면 원 단위 전체 금액이 보입니다.</p>
  </section>

  <details class="raw" id="rawBox" hidden>
    <summary>원본 응답(JSON) 보기 — 필드명 확인용</summary>
    <pre id="raw"></pre>
  </details>
</main>

<footer>
  데이터 출처: 금융위원회 기업기본정보 · 기업재무정보 (공공데이터포털). 자료가 없는 법인·연도는 표시되지 않을 수 있습니다.
</footer>

<div id="toast"></div>

<script>
  /* ===== 설정 ===== */
  // ⚠ 이 파일을 공개하면 키도 함께 노출됩니다. 공개 배포 시에는 키를 재발급하거나 서버(프록시)에서 호출하세요.
  const SERVICE_KEY = 'ec06f12bf9d2ca6e6dd77b288e779bf9b84abb35318d62b7d5ff3eec77996b8a';
  const BASE       = 'https://apis.data.go.kr/1160100/service';
  const EP_OUTLINE = BASE + '/GetCorpBasicInfoService_V2/getCorpOutline_V2';
  const EP_FIN     = BASE + '/GetFinaStatInfoService_V2/getSummFinaStat_V2';

  const PAGE_SIZE = 20;        // 화면에 표시할 페이지당 개수
  let currentPage = 1;
  let lastList = [];
  let lastQuery = '';

  /* ===== 요소 ===== */
  const $ = id => document.getElementById(id);
  const form = $('form'), q = $('q'), btn = $('btn'), useProxy = $('useProxy');
  const yFrom = $('yFrom'), yTo = $('yTo'), statusEl = $('status');

  const thisYear = new Date().getFullYear();
  for (let y = thisYear; y >= 2010; y--) {
    yFrom.add(new Option(y + '년', y));
    yTo.add(new Option(y + '년', y));
  }
  yTo.value = thisYear - 1;
  yFrom.value = thisYear - 5;

  /* ===== 유틸 ===== */
  const esc = (s = '') => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtCrno = v => /^\d{13}$/.test(v) ? `${v.slice(0,6)}-${v.slice(6)}` : (v || '');
  const fmtBiz  = v => /^\d{10}$/.test(v) ? `${v.slice(0,3)}-${v.slice(3,5)}-${v.slice(5)}` : (v || '-');

  function wonText(v) {
    const n = Number(v);
    if (v === undefined || v === null || v === '' || !isFinite(n)) return '-';
    const abs = Math.abs(n);
    const jo = Math.floor(abs / 1e12);
    const eok = Math.floor((abs % 1e12) / 1e8);
    let s;
    if (jo > 0) s = `${jo.toLocaleString()}조` + (eok ? ` ${eok.toLocaleString()}억` : '');
    else if (eok > 0) s = `${eok.toLocaleString()}억`;
    else s = abs.toLocaleString() + '원';
    return (n < 0 ? '-' : '') + s;
  }
  function fmtWon(v) {
    const t = wonText(v);
    if (t === '-') return '-';
    const n = Number(v);
    return `<span class="${n < 0 ? 'neg' : ''}" title="${n.toLocaleString()}원">${t}</span>`;
  }
  const fmtPct = v => (v === undefined || v === null || v === '' || isNaN(Number(v))) ? '-' : Number(v).toFixed(2) + '%';

  function posterColor(s) {
    let h = 0;
    for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `linear-gradient(135deg, hsl(${h},55%,32%), hsl(${(h + 40) % 360},60%,16%))`;
  }

  // 괄호로 시작하면 여는 괄호부터 닫는 괄호까지 전부 표시, 아니면 첫 글자
  const PAIRS = { '(':')', '[':']', '{':'}', '<':'>', '（':'）', '［':'］', '「':'」', '『':'』', '〈':'〉', '《':'》' };
  function posterLabel(name) {
    const t = String(name || '').trim();
    const first = t.charAt(0);
    const close = PAIRS[first];
    if (close) {
      let depth = 0;
      for (let i = 0; i < t.length; i++) {
        if (t[i] === first) depth++;
        else if (t[i] === close && --depth === 0) return t.slice(0, i + 1);
      }
      return first;   // 닫는 괄호가 없으면 첫 글자만
    }
    return (first || '?').toUpperCase();
  }
  // 글자 수가 많을수록 폰트를 줄여 카드 안에 맞춤
  const posterSize = s =>
    s.length <= 1 ? 54 : s.length === 2 ? 48 : s.length === 3 ? 42 :
    s.length === 4 ? 34 : Math.max(18, Math.floor(180 / s.length));

  function setStatus(msg, isErr = false) {
    statusEl.className = isErr ? 'error' : '';
    statusEl.textContent = msg;
  }
  function hideAll() { $('candBox').hidden = true; $('finBox').hidden = true; $('rawBox').hidden = true; }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1400);
  }
  function copy(text) {
    (navigator.clipboard?.writeText(text) ?? Promise.reject())
      .then(() => toast('복사했습니다: ' + text))
      .catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('복사했습니다: ' + text); } catch { toast('복사에 실패했습니다'); }
        ta.remove();
      });
  }
  function showSkeleton() {
    $('candBox').hidden = false;
    $('candCount').textContent = '';
    $('pager').innerHTML = '';
    $('candGrid').innerHTML = '<div class="skel"></div>'.repeat(8);
  }

  /* ===== 공통 API 호출 ===== */
  async function callApi(endpoint, params) {
    const sp = new URLSearchParams({ serviceKey: SERVICE_KEY, resultType: 'json', ...params });
    let url = `${endpoint}?${sp}`;
    if (useProxy.checked) url = 'https://corsproxy.io/?url=' + encodeURIComponent(url);

    let res;
    try {
      res = await fetch(url, { signal: AbortSignal.timeout(20000) });
    } catch (e) {
      if (e.name === 'TimeoutError') throw new Error('응답 시간 초과(20초)');
      throw new Error('API 호출 실패 (CORS 차단 또는 네트워크 오류)\n→ 우측 상단 "CORS 프록시"를 켜고 다시 시도해 보세요.');
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`API 응답 오류 (HTTP ${res.status})\n` + text.slice(0, 300)); }

    const header = data?.response?.header;
    if (header && header.resultCode !== '00')
      throw new Error(`${header.resultMsg} (코드 ${header.resultCode})`);

    const body = data?.response?.body;
    let items = body?.items?.item || [];
    if (!Array.isArray(items)) items = [items];
    return { items, totalCount: Number(body?.totalCount ?? items.length), data };
  }

  /* ===== 회사명 검색 (crno 중복 제거 + 정렬) ===== */
  async function searchCorp(name) {
    const API_PAGE_SIZE = 100, MAX_PAGES = 5;   // API에서 한 번에 가져오는 양 (화면 페이지와 별개)
    const map = new Map();

    for (let p = 1; p <= MAX_PAGES; p++) {
      const { items, totalCount } = await callApi(EP_OUTLINE, { pageNo: p, numOfRows: API_PAGE_SIZE, corpNm: name });
      for (const it of items) {
        const key = it.crno || it.corpNm;
        const prev = map.get(key);
        if (!prev || String(it.basDt || '') > String(prev.basDt || '')) map.set(key, it);
      }
      if (!items.length || p * API_PAGE_SIZE >= totalCount) break;
    }

    const list = [...map.values()];

    // 1순위: 검색어와 정확히 일치
    // 2순위: 한글 시작 → 영문·숫자 시작 → 기호 시작, 같은 그룹 안에서는 가나다순
    const group = (s) => {
      const c = String(s || '').trim().charAt(0);
      if (/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(c)) return 0;
      if (/[A-Za-z0-9]/.test(c)) return 1;
      return 2;
    };
    list.sort((a, b) => {
      const ea = a.corpNm === name ? 0 : 1;
      const eb = b.corpNm === name ? 0 : 1;
      return ea - eb
          || group(a.corpNm) - group(b.corpNm)
          || String(a.corpNm).localeCompare(String(b.corpNm), 'ko');
    });
    return list;
  }

  /* ===== 재무제표 조회 ===== */
  async function fetchFinance(crno, from, to) {
    const years = [];
    for (let y = Number(to); y >= Number(from); y--) years.push(y);

    const results = await Promise.allSettled(
      years.map(y => callApi(EP_FIN, { pageNo: 1, numOfRows: 10, crno, bizYear: y }))
    );

    const map = new Map();
    const errors = [], raws = [];
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') {
        raws.push(r.value.data);
        for (const it of r.value.items) {
          const key = `${it.bizYear || years[i]}|${it.fnclDcd || ''}`;
          const prev = map.get(key);
          if (!prev || String(it.basDt || '') > String(prev.basDt || '')) map.set(key, it);
        }
      } else {
        errors.push(`${years[i]}년: ${r.reason.message}`);
      }
    });
    return { items: [...map.values()], errors, raws };
  }

  /* ===== 렌더링: 회사 카드 + 페이지 ===== */
  function renderCandidates(list, page = 1) {
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, page), totalPages);
    const start = (currentPage - 1) * PAGE_SIZE;
    const slice = list.slice(start, start + PAGE_SIZE);

    $('candCount').textContent =
      `총 ${list.length}개 · ${start + 1}–${start + slice.length}번째 · 중복 제거됨`;

    $('candGrid').innerHTML = slice.map(it => {
      const label = posterLabel(it.corpNm);
      return `
      <article class="card" tabindex="0" data-crno="${esc(it.crno)}" data-name="${esc(it.corpNm)}">
        <div class="poster" style="background:${posterColor(it.corpNm)};font-size:${posterSize(label)}px">${esc(label)}</div>
        <div class="info">
          <div class="name">${esc(it.corpNm)}</div>
          <div class="en">${esc(it.corpEnsnNm || '')}</div>
          <div class="meta">
            <div><span>법인등록번호</span><span class="mono">${esc(fmtCrno(it.crno))}</span></div>
            <div><span>사업자번호</span><span class="mono">${esc(fmtBiz(it.bzno))}</span></div>
            <div><span>대표자</span><span>${esc(it.enpRprFnm || '-')}</span></div>
          </div>
          <div class="actions">
            <button type="button" class="chip primary" data-act="go">재무제표</button>
            <button type="button" class="chip ghost" data-act="copy" data-v="${esc(it.crno)}">번호 복사</button>
          </div>
        </div>
      </article>`;
    }).join('');

    renderPager(totalPages);
  }

  function renderPager(totalPages) {
    const nav = $('pager');
    if (totalPages <= 1) { nav.innerHTML = ''; return; }

    const WIN = 5;   // 한 번에 보이는 페이지 번호 수
    const e = Math.min(totalPages, Math.max(1, currentPage - 2) + WIN - 1);
    const s = Math.max(1, e - WIN + 1);

    let h = `<button data-p="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>‹ 이전</button>`;
    if (s > 1) h += `<button data-p="1">1</button>` + (s > 2 ? '<span class="dots">…</span>' : '');
    for (let i = s; i <= e; i++)
      h += `<button data-p="${i}" class="${i === currentPage ? 'on' : ''}">${i}</button>`;
    if (e < totalPages)
      h += (e < totalPages - 1 ? '<span class="dots">…</span>' : '') +
           `<button data-p="${totalPages}">${totalPages}</button>`;
    h += `<button data-p="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>다음 ›</button>`;
    nav.innerHTML = h;
  }

  /* ===== 렌더링: 재무제표 ===== */
  function renderFinance(crno, name, items) {
    items.sort((a, b) => (b.bizYear - a.bizYear) || String(a.fnclDcd).localeCompare(String(b.fnclDcd)));

    $('finName').textContent = name || '법인등록번호 조회 결과';
    $('finCrno').textContent = fmtCrno(crno);
    $('finCopy').dataset.v = crno;
    $('backBtn').hidden = lastList.length <= 1;   // 돌아갈 목록이 있을 때만 표시

    const latest = items[0];
    $('finType').textContent = `${latest.bizYear}년 · ${latest.fnclDcdNm || latest.fnclDcd || '재무제표'}`;
    const prev = items.find(i => Number(i.bizYear) === Number(latest.bizYear) - 1 && i.fnclDcd === latest.fnclDcd);

    const delta = (cur, old) => {
      const c = Number(cur), o = Number(old);
      if (!prev || !isFinite(c) || !isFinite(o) || o === 0) return '<span>전년 대비 -</span>';
      const r = (c - o) / Math.abs(o) * 100;
      return `<span class="${r >= 0 ? 'up' : 'down'}">${r >= 0 ? '▲' : '▼'} ${Math.abs(r).toFixed(1)}%</span> <span>전년 대비</span>`;
    };
    const kpi = (label, key) => `
      <div class="kpi">
        <div class="label">${label}</div>
        <div class="value" title="${isFinite(Number(latest[key])) ? Number(latest[key]).toLocaleString() + '원' : ''}">${wonText(latest[key])}</div>
        <div class="delta">${delta(latest[key], prev?.[key])}</div>
      </div>`;
    $('kpis').innerHTML =
      kpi('매출액', 'enpSaleAmt') + kpi('영업이익', 'enpBzopPft') +
      kpi('당기순이익', 'enpCrtmNpf') + kpi('총자산', 'enpTastAmt');

    // 연도별 매출 막대 (연도당 첫 번째 구분 기준)
    const perYear = new Map();
    for (const it of items) if (!perYear.has(it.bizYear)) perYear.set(it.bizYear, it);
    const rows = [...perYear.values()].sort((a, b) => a.bizYear - b.bizYear);
    const max = Math.max(...rows.map(r => Math.abs(Number(r.enpSaleAmt)) || 0), 1);
    $('bars').innerHTML = rows.map(r => `
      <div class="bar-row">
        <span>${esc(r.bizYear)}</span>
        <div class="bar-track"><div class="bar-fill" data-w="${(Math.abs(Number(r.enpSaleAmt)) || 0) / max * 100}"></div></div>
        <span class="v">${wonText(r.enpSaleAmt)}</span>
      </div>`).join('');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill').forEach(b => b.style.width = b.dataset.w + '%');
    }));

    $('finBody').innerHTML = items.map(it => `
      <tr>
        <td>${esc(it.bizYear)}</td>
        <td>${esc(it.fnclDcdNm || it.fnclDcd || '-')}</td>
        <td class="num">${fmtWon(it.enpSaleAmt)}</td>
        <td class="num">${fmtWon(it.enpBzopPft)}</td>
        <td class="num">${fmtWon(it.enpCrtmNpf)}</td>
        <td class="num">${fmtWon(it.enpTastAmt)}</td>
        <td class="num">${fmtWon(it.enpTdbtAmt)}</td>
        <td class="num">${fmtWon(it.enpTcptAmt)}</td>
        <td class="num">${fmtPct(it.fnclDebtRto)}</td>
      </tr>`).join('');

    $('finBox').hidden = false;
    $('finBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 재무제표 조회가 실패했을 때, 돌아갈 목록이 있으면 다시 보여줌
  function restoreListIfAny() {
    if ($('finBox').hidden && lastList.length > 1) $('candBox').hidden = false;
  }

  async function loadFinance(crno, name = '') {
    $('candBox').hidden = true; $('finBox').hidden = true; $('rawBox').hidden = true;
    if (Number(yFrom.value) > Number(yTo.value)) {
      setStatus('시작 연도가 종료 연도보다 클 수 없습니다.', true);
      restoreListIfAny();
      return;
    }
    setStatus('재무제표를 불러오는 중...');
    btn.disabled = true;
    try {
      const { items, errors, raws } = await fetchFinance(crno, yFrom.value, yTo.value);
      if (!items.length) {
        setStatus(errors.length
          ? '오류:\n' + errors.join('\n')
          : '조회된 재무제표가 없습니다. (비상장·소규모 법인이거나 해당 연도 자료가 없을 수 있습니다)', errors.length > 0);
        return;
      }
      setStatus(`재무제표 ${items.length}건` + (errors.length ? `\n일부 연도 오류:\n${errors.join('\n')}` : ''));
      renderFinance(crno, name, items);
      $('raw').textContent = JSON.stringify(raws[0], null, 2);
      $('rawBox').hidden = false;
    } catch (e) {
      setStatus('오류: ' + e.message, true);
    } finally {
      btn.disabled = false;
      restoreListIfAny();
    }
  }

  /* ===== 이벤트 ===== */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = q.value.trim();
    const v = raw.replace(/-/g, '');
    if (!raw) { setStatus('회사명 또는 법인등록번호를 입력하세요.', true); q.focus(); return; }
    lastQuery = raw;

    // 법인등록번호 13자리 → 바로 재무제표
    if (/^\d{13}$/.test(v)) { lastList = []; loadFinance(v); return; }

    hideAll();
    setStatus('법인을 검색하는 중...');
    showSkeleton();
    btn.disabled = true;
    try {
      const list = await searchCorp(raw);
      lastList = list;
      if (!list.length) { $('candBox').hidden = true; setStatus('검색된 법인이 없습니다.'); return; }

      // 중복 제거 후 1개뿐이면 바로 재무제표 조회
      if (list.length === 1) {
        btn.disabled = false;
        $('candBox').hidden = true;
        loadFinance(list[0].crno, list[0].corpNm);
        return;
      }
      setStatus('');
      renderCandidates(list, 1);
      $('candBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      $('candBox').hidden = true;
      setStatus('오류: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  $('candGrid').addEventListener('click', (e) => {
    const cp = e.target.closest('[data-act="copy"]');
    if (cp) { e.stopPropagation(); copy(cp.dataset.v); return; }
    const card = e.target.closest('.card');
    if (card) loadFinance(card.dataset.crno, card.dataset.name);
  });
  $('candGrid').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const card = e.target.closest('.card');
    if (card && e.target === card) loadFinance(card.dataset.crno, card.dataset.name);
  });

  $('pager').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (!b || b.disabled) return;
    renderCandidates(lastList, Number(b.dataset.p));
    $('candBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('finCopy').addEventListener('click', (e) => copy(e.currentTarget.dataset.v));
  $('backBtn').addEventListener('click', () => {
    $('finBox').hidden = true; $('rawBox').hidden = true;
    if (lastList.length > 1) {
      $('candBox').hidden = false; setStatus('');   // 보고 있던 페이지 그대로 복귀
      $('candBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
</script>
</body>
